
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | VyaaparBill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body data-auth-page>
  <main class="auth-page">
    <section class="card auth-card" aria-label="VyaaparBill registration">
      <div class="auth-brand-panel">
        <div class="auth-brand-content">
          <div class="auth-brand">
            <h1 class="auth-brand-title">Vyaapar<span>Bill</span></h1>
          </div>
          <p class="auth-subtitle">AI-powered inventory and billing for modern businesses.</p>
          <!-- <p class="auth-panel-note">Manage purchases, sales and<br>inventory from one workspace.</p> -->
        </div>
      </div>

      <div class="auth-form-panel">
        <div class="auth-form-wrap">
          <h2 class="auth-form-title">Create your account</h2>
          <p class="auth-form-subtitle">Set up your VyaaparBill workspace.</p>

          <div class="form-error" data-auth-error role="alert" aria-live="polite"></div>
          <div class="form-success" data-auth-success role="status" aria-live="polite"></div>

          <form class="auth-form" data-register-form novalidate>
            <label class="form-group">
              <span class="form-label">Name</span>
              <input class="form-input" type="text" name="name" autocomplete="name" placeholder="Your name" data-register-name>
            </label>

            <label class="form-group">
              <span class="form-label">Email</span>
              <input class="form-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" data-register-email>
            </label>

            <label class="form-group">
              <span class="form-label">Password</span>
              <input class="form-input" type="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" data-register-password>
            </label>

            <label class="form-group">
              <span class="form-label">Confirm Password</span>
              <input class="form-input" type="password" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter password" data-register-confirm-password>
            </label>

            <input type="hidden" name="role" value="staff" data-register-role>

            <button class="btn btn-primary" type="submit" data-register-submit>
              <span class="spinner hide" data-register-spinner aria-hidden="true"></span>
              <span data-register-button-text>Create Account</span>
            </button>
          </form>

          <p class="auth-footer">
            Already have an account?
            <a class="link" href="login.html">Sign in</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
