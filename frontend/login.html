<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VyaaparBill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body data-auth-page>
  <main class="auth-page">
    <section class="card auth-card" aria-label="VyaaparBill login">
      <div class="auth-brand-panel">
        <div class="auth-brand-content">
          <div class="auth-brand">
            <h1 class="auth-brand-title">Vyaapar<span>Bill</span></h1>
          </div>
          <p class="auth-subtitle">AI-powered inventory and billing for modern businesses.</p>
          <!-- <p class="auth-panel-note">Manage purchases, sales and<br>inventory from one workspace.</p> -->
        </div>
      </div>

      <div class="auth-form-panel">
        <div class="auth-form-wrap">
          <h2 class="auth-form-title">Welcome back</h2>
          <p class="auth-form-subtitle">Sign in to continue to your workspace.</p>

          <div class="form-error" data-auth-error role="alert" aria-live="polite"></div>

          <form class="auth-form" data-login-form novalidate>
            <label class="form-group">
              <span class="form-label">Email</span>
              <input class="form-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" data-login-email>
            </label>

            <label class="form-group">
              <span class="form-label">Password</span>
              <input class="form-input" type="password" name="password" autocomplete="current-password" placeholder="Enter password" data-login-password>
            </label>

            <div class="auth-options">
              <label class="checkbox">
                <input type="checkbox" name="remember" data-remember-me>
                <span>Remember Me</span>
              </label>
              <a class="link" href="#" aria-label="Forgot password placeholder">Forgot Password</a>
            </div>

            <button class="btn btn-primary" type="submit" data-login-submit>
              <span class="spinner hide" data-login-spinner aria-hidden="true"></span>
              <span data-login-button-text>Sign In</span>
            </button>
          </form>

          <p class="auth-footer">
            Don't have an account?
            <a class="link" href="register.html">Register</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
